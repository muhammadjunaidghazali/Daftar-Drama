      { t: "BURNOUT", title: "Know the 3 signs", script: "Exhaustion + Cynicism + Reduced sense of accomplishment.", desc: "Recognize occupational burnout before it harms health." },
      { t: "BURNOUT", title: "Ask for help", script: "Speak to a trusted colleague, doctor, or counselor.", desc: "Asking for help is strategic resilience, not weakness." },
      { t: "BURNOUT", title: "Celebrate others", script: "Congratulate a peer publicly on their win.", desc: "Break crab mentality and relieve collective competition." }
    ];

    /* =======================================================
       GAME STATE & NETWORK ENGINE
       ======================================================= */
    let peer = null;
    let connections = []; 
    let hostConn = null;  

    let myId = "";
    let myName = localStorage.getItem("dd_premium_name") || "";
    let isHost = false;
    let roomCode = "";

    // Authoritative game state
    let state = {
      phase: "LOBBY", // LOBBY, ROOM, SUBMITTING, JUDGING, REALITY_CHECK, ROUND_END, GAME_OVER
      players: [],    // [{ id, name, dafterPts, calmPts, handWhite, handKit }]
      judgeIdx: 0,
      currentPrompt: null,
      submissions: [], 
      kitSubmissions: [], 
      realityTimer: 60,
      roundWinner: null,
      calmWinner: null,
      whiteDeck: [],
      promptDeck: [],
      roundNumber: 1
    };

    let timerInterval = null;
    let selectedWhiteCards = []; // card INDICES within me.handWhite
    let lastRoundKey = "";
    let activeTab = "home"; // home, game, leaderboard, guide

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /* Network Initialization */
    function initPeer(customCode = null, onReady = null) {
      const id = customCode ? "ddp-" + customCode.toLowerCase() : "ddp-" + Math.random().toString(36).substring(2, 7);
      peer = new Peer(id);
      
      peer.on('open', (id) => {
        myId = id;
        if (onReady) onReady(id);
      });

      peer.on('connection', (conn) => {
        if (!isHost) return;
        connections.push(conn);
        conn.on('data', (data) => handleHostIncomingData(conn, data));
        conn.on('close', () => {
          connections = connections.filter(c => c !== conn);
          const wasJudge = state.players[state.judgeIdx] && state.players[state.judgeIdx].id === conn.peer;
          const leftName = (state.players.find(p => p.id === conn.peer) || {}).name || "A player";
          state.players = state.players.filter(p => p.id !== conn.peer);
          state.submissions = state.submissions.filter(s => s.playerId !== conn.peer);
          state.kitSubmissions = state.kitSubmissions.filter(k => k.playerId !== conn.peer);
          if (state.players.length > 0 && state.phase !== "LOBBY" && state.phase !== "ROOM") {
            state.judgeIdx = state.judgeIdx % state.players.length;
            if (wasJudge && state.phase === "JUDGING") {
              // Judge left with no one to pick: move to next round
              state.judgeIdx = (state.judgeIdx + 1) % state.players.length;
              state.roundNumber++;
              startNewRound();
              return;
            }
            if (wasJudge && state.phase === "SUBMITTING" && state.submissions.length >= state.players.length - 1) {
              state.phase = "JUDGING";
              state.submissions = shuffle(state.submissions);
            }
          }
          broadcastState();
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          alert("Room code is already in use. Please pick another code or rejoin.");
        }
      });
    }

    function broadcastState() {
      if (!isHost) return;
      connections.forEach(conn => {
        if (conn.open) conn.send({ type: "SYNC", state });
      });
      render();
    }

    function sendToHost(action) {
      if (isHost) {
        handleAction(myId, action);
      } else if (hostConn && hostConn.open) {
        hostConn.send(action);
      }
    }

    function handleHostIncomingData(conn, action) {
      handleAction(conn.peer, action);
    }

    /* Server Logic (Host Only) */
    function handleAction(senderId, action) {
      if (!isHost) return;

      if (action.type === "JOIN") {
        if (state.players.length >= 25) {
          const c = connections.find(x => x.peer === senderId);
          if (c && c.open) c.send({ type: "ROOM_FULL" });
          setTimeout(() => { try { c.close(); } catch(e) {} }, 300);
          return;
        }
        if (!state.players.find(p => p.id === senderId)) {
          state.players.push({
            id: senderId,
            name: action.name || "Colleague",
            dafterPts: 0,
            calmPts: 0,
            handWhite: shuffle(ANSWERS).slice(0, 7),
            handKit: shuffle(KIT_CARDS).slice(0, 2)
          });
        }
        broadcastState();
      }
      else if (action.type === "START_GAME") {
        state.promptDeck = shuffle(PROMPTS);
        state.whiteDeck = shuffle(ANSWERS);
        
        state.players.forEach(p => {
          p.handWhite = state.whiteDeck.splice(0, 7);
          p.handKit = shuffle(KIT_CARDS).slice(0, 2);
          p.dafterPts = 0;
          p.calmPts = 0;
        });
        state.judgeIdx = 0;
        state.roundNumber = 1;
        startNewRound();
      }
      else if (action.type === "SUBMIT_ANSWER") {
        if (state.phase !== "SUBMITTING") return;
        if (!state.submissions.find(s => s.playerId === senderId)) {
          state.submissions.push({ playerId: senderId, cards: action.cards });
          const p = state.players.find(pl => pl.id === senderId);
          if (p) {
            p.handWhite = p.handWhite.filter(c => !action.cards.includes(c));
          }
        }
        if (state.submissions.length >= state.players.length - 1) {
          state.phase = "JUDGING";
          state.submissions = shuffle(state.submissions);
        }
        broadcastState();
      }
      else if (action.type === "PICK_WINNER") {
        if (state.phase !== "JUDGING") return;
        const winner = state.players.find(p => p.id === action.winnerId);
        if (winner) {
          winner.dafterPts += 1;
          state.roundWinner = winner.name;
        }
        state.phase = "REALITY_CHECK";
        state.realityTimer = 60;
        state.kitSubmissions = [];
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
          state.realityTimer--;
          if (state.realityTimer <= 0) clearInterval(timerInterval);
          broadcastState();
        }, 1000);
        broadcastState();
      }
      else if (action.type === "SUBMIT_KIT") {
        if (state.phase !== "REALITY_CHECK") return;
        if (!state.kitSubmissions.find(k => k.playerId === senderId)) {
          state.kitSubmissions.push({ playerId: senderId, card: action.card });
          const p = state.players.find(pl => pl.id === senderId);
          if (p) {
            p.handKit = p.handKit.filter(c => c.title !== action.card.title);
          }
        }
        broadcastState();
      }
      else if (action.type === "AWARD_CALM_POINT") {
        if (state.phase !== "REALITY_CHECK") return;
        if (timerInterval) clearInterval(timerInterval);
        if (action.winnerId) {
          const calmWinner = state.players.find(p => p.id === action.winnerId);
          if (calmWinner) {
            calmWinner.calmPts += 1;
            state.calmWinner = calmWinner.name;
          }
        } else {
          state.calmWinner = "No one";
        }
        state.phase = "ROUND_END";
        checkEndOrRefill();
        broadcastState();
      }
      else if (action.type === "NEXT_ROUND") {
        if (state.phase !== "ROUND_END") return;
        state.judgeIdx = (state.judgeIdx + 1) % state.players.length;
        state.roundNumber++;
        startNewRound();
      }
    }

    function startNewRound() {
      if (state.promptDeck.length === 0) state.promptDeck = shuffle(PROMPTS);
      state.currentPrompt = state.promptDeck.pop();
      state.submissions = [];
      state.kitSubmissions = [];
      state.roundWinner = null;
      state.calmWinner = null;
      state.phase = "SUBMITTING";
      broadcastState();
    }

    function checkEndOrRefill() {
      state.players.forEach(p => {
        while (p.handWhite.length < 7) {
          if (state.whiteDeck.length === 0) state.whiteDeck = shuffle(ANSWERS);
          p.handWhite.push(state.whiteDeck.pop());
        }
        while (p.handKit.length < 2) {
          p.handKit.push(shuffle(KIT_CARDS)[0]);
        }
      });

      // Win Condition: 7 combined points, min 2 calm points[cite: 2]
      const victor = state.players.find(p => (p.dafterPts + p.calmPts >= 7) && p.calmPts >= 2);
      if (victor) {
        state.phase = "GAME_OVER";
      }
    }

    function joinRoomAsClient(code, name) {
      roomCode = code.toUpperCase();
      initPeer(null, () => {
        hostConn = peer.connect("ddp-" + roomCode.toLowerCase());
        hostConn.on('open', () => {
          hostConn.send({ type: "JOIN", name });
        });
        hostConn.on('data', (msg) => {
          if (msg.type === "ROOM_FULL") {
            alert("That room is full (25 players max). Try another room.");
            location.reload();
            return;
          }
          if (msg.type === "SYNC") {
            // Auto switch to game tab when host starts the game
            if (state.phase === "ROOM" && msg.state.phase === "SUBMITTING") {
              activeTab = "game";
            }
            state = msg.state;
            render();
          }
        });
        hostConn.on('close', () => {
          alert("Disconnected from host room.");
          location.reload();
        });
      });
    }

    /* =======================================================
       UI RENDERING
       ======================================================= */
    function switchTab(t) {
      activeTab = t;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById('tab-' + t);
      if (activeEl) activeEl.classList.add('active');
      render();
    }

    function toggleSelectWhiteCard(cardText, max) {
      if (selectedWhiteCards.includes(cardText)) {
        selectedWhiteCards = selectedWhiteCards.filter(c => c !== cardText);
      } else {
        if (selectedWhiteCards.length < max) {
          selectedWhiteCards.push(cardText);
        } else if (max === 1) {
          selectedWhiteCards = [cardText];
        }
      }
      render();
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function copyRoomCode() {
      const done = () => alert("Room Code " + roomCode + " copied!");
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = roomCode; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch(e) { prompt("Copy this code:", roomCode); }
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(roomCode).then(done).catch(fallback);
      } else { fallback(); }
    }

    // Cards are selected by INDEX (not text) so quotes in card text can't break the HTML
    function toggleSelectWhiteCard(idx, max) {
      if (selectedWhiteCards.includes(idx)) {
        selectedWhiteCards = selectedWhiteCards.filter(i => i !== idx);
      } else if (selectedWhiteCards.length < max) {
        selectedWhiteCards.push(idx);
      } else if (max === 1) {
        selectedWhiteCards = [idx];
      }
      render();
    }

    function submitAnswer() {
      const me = state.players.find(p => p.id === myId);
      if (!me) return;
      const cards = selectedWhiteCards.map(i => me.handWhite[i]).filter(Boolean);
      selectedWhiteCards = [];
      sendToHost({ type: 'SUBMIT_ANSWER', cards });
    }

    function playKitCard(idx) {
      const me = state.players.find(p => p.id === myId);
      if (!me || !me.handKit[idx]) return;
      sendToHost({ type: 'SUBMIT_KIT', card: { t: me.handKit[idx].t, title: me.handKit[idx].title, script: me.handKit[idx].script } });
    }

    function render() {
      const app = document.getElementById("app");
      const nav = document.getElementById("bottomNav");
      const me = state.players.find(p => p.id === myId) || { name: myName, handWhite: [], handKit: [], dafterPts: 0, calmPts: 0 };
      const currentJudge = state.players[state.judgeIdx] || { name: "Judge" };
      const isJudge = currentJudge.id === myId;

      let html = "";

      // 1. LOBBY SCREEN[cite: 15]
      if (state.phase === "LOBBY") {
        nav.style.display = "none";
        html = `
          <div class="screen active" style="padding-top: 60px;">
            <h1 class="logo">
              <span class="logo-accent">Dafter</span>
              Drama <span style="color:var(--gold);">☕</span>
            </h1>
            
            <div class="input-group" style="margin-top: 50px;">
              <label class="input-label">Colleague Name</label>
              <input type="text" id="nameInput" class="input" value="${myName}" placeholder="e.g. Asad">
            </div>
            
            <div class="input-group">
              <label class="input-label">Room Code</label>
              <input type="text" id="codeInput" class="input" placeholder="Leave blank to host">
            </div>

            <div class="btn-row" style="margin-top: 40px;">
              <button onclick="document.getElementById('codeInput').value ? hostRoom(false) : hostRoom(true)" class="btn btn-outline" style="flex: 1;">
                ☕ HOST
              </button>
              <button onclick="hostRoom(false)" class="btn" style="flex: 1;">
                🔗 JOIN
              </button>
            </div>
          </div>
        `;
      } 
      // 2. ROOM (HOME) SCREEN[cite: 15]
      else if (activeTab === "home") {
        nav.style.display = "flex";
        html = `
          <div class="header">
            <button class="header-btn" onclick="location.reload()">
              <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg> Back
            </button>
            <div class="header-title">ROOM: <span style="color:var(--gold);">${roomCode}</span></div>
            <button class="header-btn" onclick="copyRoomCode()">
              <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
            </button>
          </div>
          
          <div class="screen active">
            <h2 style="font-size: 1rem; color: var(--text-muted); margin: 10px 0 16px 0;">Player List (${state.players.length}/25)</h2>
            <div class="list-container">
              ${state.players.map((p, i) => `
                <div class="list-item">
                  <div class="avatar c${(i % 4) + 1}">${esc(p.name.charAt(0).toUpperCase())}</div>
                  <div class="player-name">${esc(p.name)}${p.id === myId ? '<span style="color:var(--text-muted); font-size:0.8rem;">(You)</span>' : ''}</div>
                  <div style="color: var(--gold);">☕</div>
                </div>
              `).join('')}
            </div>

            ${isHost && state.phase === "ROOM" ? `
              <div style="margin-top: 30px;">
                <button onclick="sendToHost({type: 'START_GAME'}); switchTab('game');" class="btn">
                  🏁 START GAME
                </button>
                <div style="text-align: center; color: var(--text-muted); font-size: 0.8rem; margin-top: 10px;">(enabled for the host)</div>
              </div>
            ` : ''}

            ${state.phase !== "ROOM" ? `
              <div class="status-box">
                <h3 style="color: var(--gold); margin-bottom: 8px;">Game is Active</h3>
                <p style="font-size: 0.9rem; color: var(--text-muted);">Tap the "Table" icon below to view the current prompt.</p>
              </div>
            ` : ''}
          </div>
        `;
      }
      // 3. GAME TABLE SCREEN[cite: 15]
      else if (activeTab === "game") {
        nav.style.display = "flex";
        const prompt = state.currentPrompt || { t: "WAITING", q: "Waiting for host to start the drama..." };
        const rk = state.roundNumber + '|' + (state.currentPrompt ? state.currentPrompt.q : '');
        if (state.phase === "SUBMITTING" && rk !== lastRoundKey) { lastRoundKey = rk; selectedWhiteCards = []; }
        const isPick2 = prompt.q.includes("[PICK 2]");
        const maxPicks = isPick2 ? 2 : 1;
        
        html = `
          <div class="header">
            <button class="header-btn" onclick="switchTab('home')">
              <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg> Room
            </button>
            <div class="header-title">Prompt</div>
            <div style="width: 60px; text-align: right; font-size: 0.75rem; color: var(--gold);">RND ${state.roundNumber}</div>
          </div>

          <div class="screen active">
            ${state.phase === "ROOM" ? `
              <div class="status-box" style="margin-top: 50px;">
                <div style="font-size: 3rem; margin-bottom: 10px;">☕</div>
                <h3 style="color: var(--gold);">Chai is Brewing...</h3>
                <p style="color: var(--text-muted); margin-top: 8px;">Waiting for the host to start the game.</p>
              </div>
            ` : `
              <div class="card-prompt">
                <div class="text">${prompt.q.replace(/_______/g, "___________")}</div>
                <div class="tag">${prompt.t} &bull; ${isPick2 ? 'PICK 2' : 'PICK 1'}</div>
              </div>

              ${state.phase === "SUBMITTING" ? `
                ${isJudge ? `
                  <div class="status-box">
                    <div style="font-size: 2.5rem; margin-bottom: 10px;">👑</div>
                    <h3 style="color: var(--gold); margin-bottom: 10px;">You are the Judge</h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Sit back. Waiting for colleagues to submit their answers (${state.submissions.length}/${state.players.length - 1})...</p>
                  </div>
                ` : `
                  <div class="section-header">
                    <div class="section-title">Your Hand</div>
                    <div class="timer-text">Pick ${maxPicks}</div>
                  </div>
                  <div class="cards-scroll">
                    ${me.handWhite.map((c, idx) => `
                      <div class="card-answer ${selectedWhiteCards.includes(idx) ? 'selected' : ''}" onclick="toggleSelectWhiteCard(${idx}, ${maxPicks})">
                        <div class="text">${c}</div>
                        <div class="check">✓</div>
                      </div>
                    `).join('')}
                  </div>
                  <button class="btn" onclick="submitAnswer()" ${selectedWhiteCards.length !== maxPicks ? 'disabled' : ''}>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> SUBMIT
                  </button>
                `}
              ` : ''}

              ${state.phase === "JUDGING" ? `
                <div class="section-header">
                  <div class="section-title">Submitted Answers</div>
                  <div class="timer-text">${isJudge ? 'Tap to Pick' : 'Judge is reading'}</div>
                </div>
                <div class="cards-scroll">
                  ${state.submissions.map(s => `
                    <div class="card-answer" onclick="${isJudge ? `sendToHost({type: 'PICK_WINNER', winnerId: '${s.playerId}'})` : ''}">
                      <div class="text">${s.cards.join('<br><span style="color:var(--gold); font-size:0.8rem;">AND</span><br>')}</div>
                      ${isJudge ? '<div class="check" style="display:flex; background:var(--surface); color:var(--gold);">?</div>' : ''}
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              ${state.phase === "REALITY_CHECK" ? `
                <div class="section-header">
                  <div class="section-title">Reality Check</div>
                  <div class="timer-text"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg> ${state.realityTimer}s</div>
                </div>
                <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 16px;">
                  What does a healthy response look like?
                </p>

                ${!isJudge ? `
                  <h4 style="color: var(--gold); margin-bottom: 10px; font-size: 0.9rem;">Play a Kit Card:</h4>
                  ${me.handKit.map((k, idx) => `
                    <div class="card-kit" onclick="playKitCard(${idx})">
                      <div class="tag">${k.t}</div>
                      <div class="title">${k.title}</div>
                      <div class="script">${k.script}</div>
                    </div>
                  `).join('')}
                ` : `
                  <h4 style="color: var(--gold); margin-bottom: 10px; font-size: 0.9rem;">Played by Colleagues (Tap to award 1 Calm Point):</h4>
                  ${state.kitSubmissions.length === 0 ? '<p style="color: var(--text-muted); font-size: 0.9rem;">No kit cards played yet.</p>' : ''}
                  ${state.kitSubmissions.map(ks => `
                    <div class="card-kit" onclick="sendToHost({type: 'AWARD_CALM_POINT', winnerId: '${ks.playerId}'})">
                      <div class="tag">${ks.card.t}</div>
                      <div class="title">${ks.card.title}</div>
                      <div class="script">${ks.card.script}</div>
                    </div>
                  `).join('')}
                  <button class="btn btn-outline" style="margin-top: 15px;" onclick="sendToHost({type: 'AWARD_CALM_POINT', winnerId: null})">Skip Calm Point</button>
                `}
              ` : ''}

              ${state.phase === "ROUND_END" ? `
                <div class="status-box">
                  <h3 style="color: var(--gold); margin-bottom: 12px;">Round Results</h3>
                  <p style="margin-bottom: 6px;">Dafter Point: <strong>${esc(state.roundWinner || 'None')}</strong></p>
                  <p style="margin-bottom: 20px;">Calm Point: <strong>${esc(state.calmWinner || 'None')}</strong></p>
                  ${isHost ? `<button class="btn" onclick="sendToHost({type: 'NEXT_ROUND'})">Next Round ➔</button>` : `<p style="font-size:0.8rem; color:var(--text-muted);">Waiting for host...</p>`}
                </div>
              ` : ''}

              ${state.phase === "GAME_OVER" ? `
                <div class="status-box">
                  <div style="font-size: 3rem; margin-bottom: 10px;">🏆</div>
                  <h2 style="color: var(--gold); margin-bottom: 12px;">Office Survived!</h2>
                  <p style="margin-bottom: 20px; font-size: 0.95rem; color: var(--text-muted);">Someone reached 7 points with at least 2 calm points. Check the Profile tab for the final standings!</p>
                  ${isHost ? `<button class="btn" onclick="sendToHost({type: 'START_GAME'})">Play Again</button>` : ''}
                </div>
              ` : ''}
            `}
          </div>
        `;
      }
      // 4. LEADERBOARD SCREEN[cite: 15]
      else if (activeTab === "leaderboard") {
        nav.style.display = "flex";
        html = `
          <div class="header">
            <div class="header-title" style="margin: 0 auto;">DAFTERI PROFILE</div>
          </div>
          <div class="screen active">
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
              <div style="width: 110px; height: 110px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; background: var(--surface); box-shadow: 0 0 20px rgba(227, 179, 90, 0.1);">☕</div>
            </div>
            
            <div style="display: flex; justify-content: space-around; text-align: center; margin-bottom: 30px; border-bottom: 1px solid var(--surface-light); padding-bottom: 20px;">
              <div><div style="font-size:1.6rem; font-weight:bold; color:var(--text);">${me.dafterPts}</div><div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Dafter Pts</div></div>
              <div><div style="font-size:1.6rem; font-weight:bold; color:var(--text);">${me.calmPts}</div><div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Calm Pts</div></div>
              <div><div style="font-size:1.6rem; font-weight:bold; color:var(--text);">${me.dafterPts + me.calmPts}</div><div style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase;">Total</div></div>
            </div>
            
            <h3 style="font-size: 0.9rem; margin-bottom: 12px; color: var(--text-muted); text-transform:uppercase; letter-spacing: 1px;">Live Rankings</h3>
            <div class="list-container">
              ${[...state.players].sort((a,b) => (b.dafterPts+b.calmPts) - (a.dafterPts+a.calmPts)).map((p, i) => `
                <div class="list-item">
                  <div style="color: var(--gold); font-weight: bold; width: 20px; font-size: 1.1rem;">${i+1}</div>
                  <div class="player-name">${esc(p.name)}${p.id === myId ? '<span style="color:var(--text-muted); font-size:0.8rem;">(You)</span>' : ''}</div>
                  <div style="font-size: 0.9rem; display: flex; gap: 8px;">
                    <span style="color: var(--text-muted);">${p.dafterPts}D</span>
                    <span style="color: var(--kit-border);">${p.calmPts}C</span>
                  </div>
                </div>
              `).join('')}
            </div>

            <div class="badge-grid" style="margin-top: 30px;">
              <div><div class="badge-icon">🗣️</div><div class="badge-label">Gossip Survivor</div></div>
              <div><div class="badge-icon">👔</div><div class="badge-label">Meeting Master</div></div>
              <div><div class="badge-icon">🤝</div><div class="badge-label">Office Diplomat</div></div>
            </div>
          </div>
        `;
      }
      // 5. GUIDE SCREEN
      else if (activeTab === "guide") {
        nav.style.display = "flex";
        html = `
          <div class="header">
            <div class="header-title" style="margin: 0 auto;">SURVIVAL GUIDE</div>
          </div>
          <div class="screen active">
            <div class="card-prompt" style="min-height: auto; padding: 20px; border-color: var(--surface-light);">
              <h3 style="color: var(--gold); margin-bottom: 10px;">How to Win</h3>
              <p style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 15px;">
                First player to <strong>7 total points</strong> wins, but you MUST have at least <strong>2 Calm Points</strong>[cite: 2]. Funny alone isn't enough; you must prove you can handle office drama.
              </p>
              <h3 style="color: var(--gold); margin-bottom: 10px;">House Rules</h3>
              <ul style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; padding-left: 20px; margin-bottom: 10px;">
                <li><strong>No real names.</strong> Don't use actual colleagues.[cite: 2]</li>
                <li><strong>Confidentiality.</strong> What's said at the chai table stays at the chai table.[cite: 2]</li>
                <li><strong>Pass is fine.</strong> You can skip the Reality Check if you don't want to share.[cite: 2]</li>
              </ul>
            </div>
          </div>
        `;
      }

      app.innerHTML = html;
      document.querySelectorAll('.nav-item').forEach(el => {
        if(el.id === 'tab-' + activeTab) el.classList.add('active');
      });
    }

    function hostRoom(isHosting) {
      const name = document.getElementById("nameInput").value.trim() || "Player";
      localStorage.setItem("dd_premium_name", name);
      myName = name;
      
      if (isHosting) {
        isHost = true;
        roomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
        state.phase = "ROOM";
        initPeer(roomCode, () => {
          state.players = [{ 
            id: myId, name: myName, dafterPts: 0, calmPts: 0, 
            handWhite: shuffle(ANSWERS).slice(0, 7), 
            handKit: shuffle(KIT_CARDS).slice(0, 2) 
          }];
          activeTab = "home";
          render();
        });
      } else {
        const code = document.getElementById("codeInput").value.trim();
        if (!code) return alert("Enter a room code!");
        isHost = false;
        state.phase = "ROOM";
        activeTab = "home";
        joinRoomAsClient(code, myName);
      }
    }

    window.addEventListener('beforeunload', () => { if (peer) { try { peer.destroy(); } catch(e) {} } });

    // Initialize UI
    render();
  </script>
</body>
</html>
